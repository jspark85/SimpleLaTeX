<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time LaTeX equation converter</title>
    
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; }
        
        header { background-color: #2c3e50; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.2rem; }
        .info { font-size: 0.9rem; color: #bdc3c7; }

        /* 메인 레이아웃: 좌우 분할 */
        .container { display: flex; flex: 1; height: 100%; }
        
        /* 왼쪽: 입력창 */
        .input-area { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #ddd; background: #f9f9f9; }
        .input-label { padding: 10px; font-weight: bold; color: #555; background: #eee; border-bottom: 1px solid #ddd; }
        textarea { 
            flex: 1; width: 100%; border: none; padding: 20px; font-family: 'Consolas', 'Monaco', monospace; 
            font-size: 16px; resize: none; outline: none; box-sizing: border-box; 
        }

        /* 오른쪽: 출력창 */
        .output-area { flex: 1; display: flex; flex-direction: column; background: white; }
        .output-label { padding: 10px; font-weight: bold; color: #555; background: #eee; border-bottom: 1px solid #ddd; }
        #preview { 
            flex: 1; padding: 30px; font-size: 24px; overflow-y: auto; 
            display: flex; align-items: center; justify-content: center;
        }

        /* 예시 버튼 */
        .examples { padding: 10px; background: #eee; border-top: 1px solid #ddd; display: flex; gap: 10px; overflow-x: auto; }
        .btn-ex { padding: 5px 10px; background: white; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; font-size: 0.85em; white-space: nowrap; }
        .btn-ex:hover { background: #e0e0e0; }
    </style>
</head>
<body>

<header>
    <h1>LaTeX equation converter</h1>
    <span class="info">MathJax v3 used</span>
</header>

<div class="container">
    <div class="input-area">
        <div class="input-label">Enter LaTeX code (enter formulas only)</div>
        <textarea id="latexInput" placeholder="Enter your formula here...&#13;&#10;예: \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}">\int_{a}^{b} x^2 dx</textarea>
        
        <div class="examples">
            <button class="btn-ex" onclick="setEx(1)">Solution to quadratic equation</button>
            <button class="btn-ex" onclick="setEx(2)">Intergration</button>
            <button class="btn-ex" onclick="setEx(3)">Matrix</button>
            <button class="btn-ex" onclick="setEx(4)">Maxwell's equations</button>
        </div>
    </div>

    <div class="output-area">
        <div class="output-label">Live Preview</div>
        <div id="preview"></div>
    </div>
</div>

<script>
    const input = document.getElementById('latexInput');
    const preview = document.getElementById('preview');

    // 초기 실행
    renderMath();

    // 입력할 때마다 렌더링 실행
    input.addEventListener('input', renderMath);

    function renderMath() {
        // 입력값 가져오기
        let latex = input.value;

        // MathJax가 인식할 수 있도록 $$ (Display Mode)로 감싸기
        // 사용자는 $$ 없이 수식만 적으면 됩니다.
        preview.innerText = "$$" + latex + "$$";

        // MathJax에게 변환 요청 (비동기 처리)
        if (window.MathJax) {
            MathJax.typesetPromise([preview]).catch((err) => console.log('Typeset failed: ' + err.message));
        }
    }

    // 예제 버튼 기능
    function setEx(type) {
        let code = "";
        if(type === 1) code = "x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}";
        if(type === 2) code = "\\int_{-\\infty}^{\\infty} e^{-x^2} dx = \\sqrt{\\pi}";
        if(type === 3) code = "\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}";
        if(type === 4) code = "\\nabla \\cdot \\mathbf{E} = \\frac{\\rho}{\\varepsilon_0}";
        
        input.value = code;
        renderMath();
    }
</script>

</body>
</html>
